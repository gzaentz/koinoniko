[project]
name = "leadpoet-social-brain"
version = "0.2.0"
description = "Local-first Social Brain v0 for Leadpoet founder/social post generation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
leadpoet-social-brain = "leadpoet_social_brain.cli:main"

[tool.setuptools.packages.find]
include = ["leadpoet_social_brain*"]

[tool.setuptools.package-data]
"leadpoet_social_brain.web" = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
